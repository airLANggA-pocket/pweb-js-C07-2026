<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Mini Shopee</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-illustration">
        <img src="foto/logincardpic.jpg" alt="Ilustrasi Mini Shopee">
      </div>

      <div class="login-form-side">
        <p class="register-link">Belum punya akun? <a href="#">Daftar sekarang</a></p>

        <h1 class="login-title">Welcome</h1>
        <p class="login-subtitle">Let's Shop!</p>

        <form id="loginForm" class="login-form" novalidate>
          <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
          </div>

          <div class="form-group password-group">
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="toggle-password" aria-label="Tampilkan password"></button>
          </div>

          <div id="errorMessage" class="error-message" hidden></div>

          <button type="submit" id="loginBtn" class="btn-primary">
            <span id="btnText">Masuk</span>
            <span id="loadingSpinner" class="spinner" hidden></span>
          </button>
        </form>

        <p class="login-hint">Coba: username <b>emilys</b> / password <b>emilyspass</b></p>
      </div>

    </div>
  </div>

  <script src="login.js" defer></script>
</body>
</html>
