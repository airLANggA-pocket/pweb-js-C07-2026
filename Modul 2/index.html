<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETALASE - Katalog Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Helvetica+Neue:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar-wrapper">
  <div class="navbar-topbar">
    <span class="greeting" id="greeting">Halo, ...</span>
    <button class="logout-btn" id="logoutBtn">Keluar</button>
  </div>

  <div class="navbar-main">
    <div class="navbar-side">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari produk...">
    </div>
    <a href="landing.html" class="logo">ETALASE</a>
    <div class="navbar-side navbar-side-right">
      <span class="cart-total" id="cartTotal">Rp0</span>
      <div class="cart-icon-wrapper" id="cartIcon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>
  </div>
</nav>

  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">ETALASE</h1>
      <p class="hero-subtitle">Belanja kebutuhanmu, secukupnya dan secepatnya.</p>
      <a href="#katalog" class="hero-btn">Belanja Sekarang</a>
    </div>
  </section>

  <section id="katalog" class="catalog-section">
    <h2 class="section-title">Produk Untukmu</h2>

    <div class="filter-bar">
      <select id="categoryFilter">
        <option value="all">Semua kategori</option>
      </select>
      <select id="sortFilter">
        <option value="default">Urutkan</option>
        <option value="price-asc">Harga: Termurah</option>
        <option value="price-desc">Harga: Termahal</option>
        <option value="rating-desc">Rating Tertinggi</option>
      </select>
      <span class="result-count" id="resultCount"></span>
    </div>

    <div id="globalError" class="global-error" hidden></div>

    <main class="product-grid" id="productGrid"></main>

    <div class="load-more-wrapper">
      <button id="loadMoreBtn" class="load-more-btn" hidden>Muat lebih banyak</button>
    </div>
  </section>

  <footer class="site-footer">
    <p>ETALASE — Tugas Praktikum Modul 2, Pemrograman Web 2026.</p>
  </footer>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="app.js" defer></script>
  <script src="search.js" defer></script>
  <script src="cart.js" defer></script>
  <script src="modal.js" defer></script>
</body>
</html>
